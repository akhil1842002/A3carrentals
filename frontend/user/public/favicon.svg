<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with Vibrant Orange Border -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="url(#bgGrad)" stroke="#f96d00" stroke-width="22" />

  <!-- Car Silhouette -->
  <!-- Fastback roof & hood -->
  <polygon points="80,140 100,105 160,82 280,82 380,105 432,140 420,158 92,158" fill="#f96d00" />
  
  <!-- Windows -->
  <polygon points="170,135 220,95 245,95 245,135" fill="#0f172a" />
  <polygon points="265,95 315,95 370,135 265,135" fill="#0f172a" />

  <!-- Wheels -->
  <!-- Rear Wheel -->
  <circle cx="160" cy="158" r="28" fill="#0f172a" stroke="#f96d00" stroke-width="6" />
  <circle cx="160" cy="158" r="12" fill="#ffffff" />
  <!-- Front Wheel -->
  <circle cx="352" cy="158" r="28" fill="#0f172a" stroke="#f96d00" stroke-width="6" />
  <circle cx="352" cy="158" r="12" fill="#ffffff" />

  <!-- Speed divider line -->
  <line x1="70" y1="188" x2="442" y2="188" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" />

  <!-- Stylized "A3" text -->
  <g font-family="'Lato', 'Poppins', -apple-system, sans-serif" font-weight="900" font-size="220" text-anchor="middle">
    <text x="180" y="380" fill="#ffffff">A</text>
    <text x="330" y="380" fill="#f96d00">3</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="160" y="440" width="192" height="9" rx="4.5" fill="#f96d00" />
</svg>